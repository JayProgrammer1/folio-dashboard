services:
  - type: web
    name: folio-workspace
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: folio-db
          property: connectionString

databases:
  - name: folio-db
    plan: free
    databaseName: folio
